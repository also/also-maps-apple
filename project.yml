name: AlsoMaps
options:
  bundleIdPrefix: dev.also
  deploymentTarget:
    visionOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
    iOS: "26.0"
# Optimized: Debug (keys from Config/Secrets.xcconfig, DEBUG code) compiled
# as fast as Release, for running on a device. The unoptimized Debug build
# misses frame deadlines on Vision Pro (notes/metal-renderer.md).
configs:
  Debug: debug
  Optimized: debug
  Release: release
settings:
  base:
    # Xcode's recommended project settings, set here so it stops prompting.
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # CesiumNative.xcframework has only arm64 slices. Xcode's default also
    # includes x86_64 for macOS and the simulators, which a generic simulator
    # destination builds and then fails to link.
    ARCHS: arm64
  configs:
    Optimized:
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_DEBUG_DYLIB: NO
packages:
  # cesium-native, prebuilt: https://github.com/also/cesium-native-xcframework
  CesiumNative:
    url: https://github.com/also/cesium-native-xcframework
    exactVersion: 0.66.0-1
settingGroups:
  # Compiling against cesium-native: its headers, and the targets that include
  # CNTileStreamer.mm.
  CesiumBridge:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    # cesium-native's headers trip -Wdocumentation; not ours to fix.
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    # cesium-native's exported INTERFACE_COMPILE_DEFINITIONS; its headers
    # (and glm/spdlog/async++ layouts) must be seen the same way here.
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - GLM_FORCE_XYZW_ONLY
      - GLM_FORCE_EXPLICIT_CTOR
      - GLM_FORCE_INTRINSICS
      - GLM_ENABLE_EXPERIMENTAL
      - LIBASYNC_STATIC
      - SPDLOG_COMPILED_LIB
      - SPDLOG_FMT_EXTERNAL
      # The xcframework is a Release build. Without NDEBUG, a Debug build
      # sees an extra thread-ID field in cesium-native's non-thread-safe
      # ReferenceCounted (e.g. RasterOverlay), so inline reference counting
      # here reads past the library's objects and asserts.
      - NDEBUG
  # One app on every platform. The Mac shows this name, not the display name, in
  # Finder and the menu bar; Swift module names can't have spaces.
  AppName:
    PRODUCT_NAME: Also Maps
    PRODUCT_MODULE_NAME: AlsoMaps
configFiles:
  Debug: Config/App.xcconfig
  Optimized: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  Also Maps visionOS:
    scheme:
      # Tick ALSOMAPS_* to stream the public Cesium sample instead of Google's tiles.
      environmentVariables: &visionOSEnvironment
        - variable: ALSOMAPS_TILESET_URL
          value: https://raw.githubusercontent.com/CesiumGS/3d-tiles-samples/main/1.0/TilesetWithDiscreteLOD/tileset.json
          isEnabled: false
        - variable: ALSOMAPS_LAT
          value: "40.0425306"
          isEnabled: false
        - variable: ALSOMAPS_LON
          value: "-75.6120943"
          isEnabled: false
        - variable: ALSOMAPS_RADIUS
          value: "800"
          isEnabled: false
    type: application
    platform: visionOS
    sources:
      - path: Sources
        excludes: [Static, Screen]
    dependencies:
      - package: CesiumNative
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Also Maps
        # Only encryption built into the OS (CesiumNative's OpenSSL isn't linked in): exempt, so
        # TestFlight skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        GoogleMapsAPIKey: $(GOOGLE_MAPS_API_KEY)
        CesiumIonToken: $(CESIUM_ION_TOKEN)
        # Game controllers drive the map (MapInput) rather than system navigation.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        # Documents (camera tracks) shows in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleVolumetricApplication
    postBuildScripts:
      # Local/ is gitignored, for assets that can't be published. Bundle the
      # soundtrack only if it's there; without it the app has no soundtrack.
      - name: Copy optional soundtrack
        basedOnDependencyAnalysis: false
        script: |
          src="${SRCROOT}/Local/soundtrack.mp3"
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/soundtrack.mp3"
          if [ -f "$src" ]; then
            cp "$src" "$dst"
          else
            rm -f "$dst"
          fi
      # Which checkout, branch and commit the build came from, for Settings >
      # Advanced. Every build, since none of that is a declared input.
      - name: Write build info
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/Scripts/write_build_info.sh"'
    settings:
      groups: [CesiumBridge, AppName]
      base:
        # The scripts read an optional, undeclared file and the git checkout.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.also.maps
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AlsoMaps-Bridging-Header.h
      configs:
        # App Attest, for the app's key, needs an explicit App ID on the
        # maintainer's team. Debug builds leave it out unless
        # Config/Secrets.xcconfig opts in (Config/App.xcconfig), so anyone's
        # team can sign them with its wildcard profile.
        Debug: &debugEntitlements
          CODE_SIGN_ENTITLEMENTS: $(DEBUG_CODE_SIGN_ENTITLEMENTS)
        Optimized: *debugEntitlements
        # Release builds get keys at run time (CredentialStore), so none ship.
        # App Attest uses Apple's production service in every build, so local
        # and distributed builds work against the same credentials API.
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/AppAttest.entitlements
          GOOGLE_MAPS_API_KEY: ""
          CESIUM_ION_TOKEN: ""

  # The macOS app: same bundle ID as the visionOS app, so both ship as one App
  # Store listing (universal purchase). A map flown with a mouse or trackpad,
  # the keyboard or a game controller (Screen), sharing the navigation core, the streaming
  # layer (TileStreaming and below) and the cesium-native bridge.
  Also Maps macOS:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: SourcesMac
      - path: Sources
        includes:
          - Assets.xcassets
          - Navigation
          - NavigationRealityKit.swift
          - Metal
          - Static
          - Screen
          - Settings
          - MapInput.swift
          - Tracks
          - TrackSession.swift
          - TrackOverlay.swift
          - TubeExtruder.swift
          - StreamingSettings.swift
          - Signposts.swift
          - TileSource.swift
          - TileStreaming.swift
          - TileUploader.swift
          - DebugLines.swift
          - Config
          - Credentials
          - Places
          - Diagrams
          - MapPresentation.swift
          - MapViewState.swift
          - Cesium/CNTileStreamer.h
          - Cesium/CNTileStreamer.mm
    dependencies:
      - package: CesiumNative
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    info:
      path: SourcesMac/Info.plist
      properties:
        CFBundleDisplayName: Also Maps
        # Only encryption built into the OS (CesiumNative's OpenSSL isn't linked in): exempt, so
        # TestFlight skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        GoogleMapsAPIKey: $(GOOGLE_MAPS_API_KEY)
        CesiumIonToken: $(CESIUM_ION_TOKEN)
        LSApplicationCategoryType: public.app-category.navigation
    postBuildScripts:
      # Which checkout, branch and commit the build came from, for Settings >
      # Advanced. Every build, since none of that is a declared input.
      - name: Write build info
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/Scripts/write_build_info.sh"'
    settings:
      groups: [CesiumBridge, AppName]
      base:
        # The build info script reads the git checkout.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.also.maps
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AlsoMaps-Bridging-Header.h
      configs:
        # Debug builds run unsandboxed so tools and agents can launch the
        # binary with ALSOMAPS_* variables, read its stdout, and inspect its
        # caches under ~/Library/Caches. Release keeps the sandbox.
        Debug:
          CODE_SIGN_ENTITLEMENTS: SourcesMac/AlsoMapsMac.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: SourcesMac/AlsoMapsMac.entitlements
          # Keys come from the user; see CredentialStore.
          GOOGLE_MAPS_API_KEY: ""
          CESIUM_ION_TOKEN: ""

  # The platform-neutral navigation core (Sources/Navigation), tested on
  # macOS without a scene, cesium-native or the network.
  Also Maps Core Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Navigation
      # Foundation-only model types, for view-state round trips.
      - path: Sources/MapViewState.swift
      - path: Sources/StreamingSettings.swift
      - path: Sources/TileSource.swift
      - path: Sources/Static/StaticView.swift
      - path: Sources/Metal/MetalVisibility.swift
      - path: Tests/Metal
      - path: Sources/Places/Place.swift
      - path: Sources/Config/AppConfig.swift
      - path: Sources/Config/AppConfigStore.swift
      - path: Sources/Credentials/CredentialStore.swift
      - path: Sources/Credentials/AppKeyClient.swift
      - path: Tests/Config
      - path: Tests/Static
      - path: Sources/Tracks
      - path: Tests/Navigation
    scheme:
      testTargets: ["Also Maps Core Tests"]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.also.maps.CoreTests

  # Static map on Apple TV, sharing the Mac scene and streaming pipeline.
  Also Maps tvOS:
    type: application
    platform: tvOS
    scheme: {}
    sources:
      - path: SourcesTV
      - path: Sources
        includes:
          - Assets.xcassets
          - Navigation
          - NavigationRealityKit.swift
          - Static
          - StreamingSettings.swift
          - Signposts.swift
          - TileSource.swift
          - TileStreaming.swift
          - TileUploader.swift
          - DebugLines.swift
          - Config
          - Credentials/CredentialStore.swift
          - Credentials/AppKeyClient.swift
          - Places
          - Cesium/CNTileStreamer.h
          - Cesium/CNTileStreamer.mm
    dependencies:
      - package: CesiumNative
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    info:
      path: SourcesTV/Info.plist
      properties:
        CFBundleDisplayName: Also Maps
        # Only encryption built into the OS (CesiumNative's OpenSSL isn't linked in): exempt, so
        # TestFlight skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        GoogleMapsAPIKey: $(GOOGLE_MAPS_API_KEY)
        CesiumIonToken: $(CESIUM_ION_TOKEN)
        UILaunchScreen: {}
    settings:
      groups: [CesiumBridge, AppName]
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.also.maps
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AlsoMaps-Bridging-Header.h

  # The flying map on iPhone and iPad, with drone-style on-screen sticks and saved
  # places, sharing the Mac's screen map (Screen).
  Also Maps iOS:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: SourcesPhone
      - path: Sources
        includes:
          - Assets.xcassets
          - Navigation
          - NavigationRealityKit.swift
          - Metal
          - Static
          - Screen
          - Settings
          - MapInput.swift
          - Tracks
          - TrackSession.swift
          - TrackOverlay.swift
          - TubeExtruder.swift
          - StreamingSettings.swift
          - Signposts.swift
          - TileSource.swift
          - TileStreaming.swift
          - TileUploader.swift
          - DebugLines.swift
          - Config
          - Credentials
          - Places
          - Cesium/CNTileStreamer.h
          - Cesium/CNTileStreamer.mm
    dependencies:
      - package: CesiumNative
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    info:
      path: SourcesPhone/Info.plist
      properties:
        CFBundleDisplayName: Also Maps
        # Only encryption built into the OS (CesiumNative's OpenSSL isn't linked in): exempt, so
        # TestFlight skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        GoogleMapsAPIKey: $(GOOGLE_MAPS_API_KEY)
        CesiumIonToken: $(CESIUM_ION_TOKEN)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad: every orientation, so it can share the screen with other apps.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    postBuildScripts:
      # Which checkout, branch and commit the build came from, for Settings >
      # Advanced. Every build, since none of that is a declared input.
      - name: Write build info
        basedOnDependencyAnalysis: false
        script: '"${SRCROOT}/Scripts/write_build_info.sh"'
    settings:
      groups: [CesiumBridge, AppName]
      base:
        # The build info script reads the git checkout.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.also.maps
        # iPhone and iPad, natively (not iPad's scaled iPhone mode).
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AlsoMaps-Bridging-Header.h
      configs:
        # Entitlements as for the visionOS app.
        Debug: *debugEntitlements
        Optimized: *debugEntitlements
        # Release builds get keys at run time (CredentialStore), so none ship.
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/AppAttest.entitlements
          GOOGLE_MAPS_API_KEY: ""
          CESIUM_ION_TOKEN: ""

schemes:
  # The visionOS app built Optimized, without Metal API validation or GPU
  # frame capture: for using it on a Vision Pro rather than debugging it.
  Also Maps visionOS (Optimized):
    build:
      targets:
        Also Maps visionOS: all
    run:
      config: Optimized
      enableGPUValidationMode: disabled
      enableGPUFrameCaptureMode: disabled
      environmentVariables: *visionOSEnvironment
    profile:
      config: Optimized
    analyze:
      config: Optimized
    archive:
      config: Release
