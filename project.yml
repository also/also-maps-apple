name: AlsoMaps
options:
  bundleIdPrefix: dev.also
  deploymentTarget:
    visionOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
    iOS: "26.0"
settings:
  base:
    # Xcode's recommended project settings, set here so it stops prompting.
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  # cesium-native, prebuilt: https://github.com/also/cesium-native-xcframework
  CesiumNative:
    url: https://github.com/also/cesium-native-xcframework
    exactVersion: 0.64.0-2
settingGroups:
  # Compiling against cesium-native: its headers, and the targets that include
  # CNTileStreamer.mm.
  CesiumBridge:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    # cesium-native's headers trip -Wdocumentation; not ours to fix.
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO
    # cesium-native's exported INTERFACE_COMPILE_DEFINITIONS; its headers
    # (and glm/spdlog/async++ layouts) must be seen the same way here.
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - GLM_FORCE_XYZW_ONLY
      - GLM_FORCE_EXPLICIT_CTOR
      - GLM_FORCE_INTRINSICS
      - GLM_ENABLE_EXPERIMENTAL
      - LIBASYNC_STATIC
      - SPDLOG_COMPILED_LIB
      - SPDLOG_FMT_EXTERNAL
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  AlsoMaps:
    scheme:
      # Tick ALSOMAPS_* to stream the public Cesium sample instead of Google's tiles.
      environmentVariables:
        - variable: ALSOMAPS_TILESET_URL
          value: https://raw.githubusercontent.com/CesiumGS/3d-tiles-samples/main/1.0/TilesetWithDiscreteLOD/tileset.json
          isEnabled: false
        - variable: ALSOMAPS_LAT
          value: "40.0425306"
          isEnabled: false
        - variable: ALSOMAPS_LON
          value: "-75.6120943"
          isEnabled: false
        - variable: ALSOMAPS_RADIUS
          value: "800"
          isEnabled: false
    type: application
    platform: visionOS
    sources:
      - path: Sources
        excludes: [Static, Screen]
    dependencies:
      - package: CesiumNative
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Also Maps
        GoogleMapsAPIKey: $(GOOGLE_MAPS_API_KEY)
        CesiumIonToken: $(CESIUM_ION_TOKEN)
        # Game controllers drive the map (MapInput) rather than system navigation.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        # Documents (camera tracks) shows in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleVolumetricApplication
    postBuildScripts:
      # Local/ is gitignored, for assets that can't be published. Bundle the
      # soundtrack only if it's there; without it the app has no soundtrack.
      - name: Copy optional soundtrack
        basedOnDependencyAnalysis: false
        script: |
          src="${SRCROOT}/Local/soundtrack.mp3"
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/soundtrack.mp3"
          if [ -f "$src" ]; then
            cp "$src" "$dst"
          else
            rm -f "$dst"
          fi
    settings:
      groups: [CesiumBridge]
      base:
        # The soundtrack script reads an optional, undeclared file.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.also.maps
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AlsoMaps-Bridging-Header.h

  # The macOS app: same bundle ID as the visionOS app, so both ship as one App
  # Store listing (universal purchase). A map flown with the keyboard or a
  # game controller (Screen), sharing the navigation core, the streaming
  # layer (TileStreaming and below) and the cesium-native bridge.
  AlsoMapsMac:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: SourcesMac
      - path: Sources
        includes:
          - Assets.xcassets
          - Navigation
          - NavigationRealityKit.swift
          - Static
          - Screen
          - MapInput.swift
          - Tracks
          - TrackSession.swift
          - TrackOverlay.swift
          - TubeExtruder.swift
          - StreamingSettings.swift
          - Signposts.swift
          - TileSource.swift
          - TileStreaming.swift
          - TileUploader.swift
          - DebugLines.swift
          - Places
          - Cesium/CNTileStreamer.h
          - Cesium/CNTileStreamer.mm
    dependencies:
      - package: CesiumNative
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    info:
      path: SourcesMac/Info.plist
      properties:
        CFBundleDisplayName: Also Maps
        GoogleMapsAPIKey: $(GOOGLE_MAPS_API_KEY)
        CesiumIonToken: $(CESIUM_ION_TOKEN)
        LSApplicationCategoryType: public.app-category.navigation
    settings:
      groups: [CesiumBridge]
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.also.maps
        PRODUCT_NAME: AlsoMaps
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AlsoMaps-Bridging-Header.h
      configs:
        # Debug builds run unsandboxed so tools and agents can launch the
        # binary with ALSOMAPS_* variables, read its stdout, and inspect its
        # caches under ~/Library/Caches. Release keeps the sandbox.
        Debug:
          CODE_SIGN_ENTITLEMENTS: SourcesMac/AlsoMapsMac.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: SourcesMac/AlsoMapsMac.entitlements

  # The platform-neutral navigation core (Sources/Navigation), tested on
  # macOS without a scene, cesium-native or the network.
  AlsoMapsCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Navigation
      # Foundation-only model types, for view-state round trips.
      - path: Sources/MapViewState.swift
      - path: Sources/StreamingSettings.swift
      - path: Sources/TileSource.swift
      - path: Sources/Static/StaticView.swift
      - path: Sources/Places/Place.swift
      - path: Tests/Static
      - path: Sources/Tracks
      - path: Tests/Navigation
    scheme:
      testTargets: [AlsoMapsCoreTests]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.also.maps.CoreTests

  # Static map on Apple TV, sharing the Mac scene and streaming pipeline.
  AlsoMapsTV:
    type: application
    platform: tvOS
    scheme: {}
    sources:
      - path: SourcesTV
      - path: Sources
        includes:
          - Assets.xcassets
          - Navigation
          - NavigationRealityKit.swift
          - Static
          - StreamingSettings.swift
          - Signposts.swift
          - TileSource.swift
          - TileStreaming.swift
          - TileUploader.swift
          - DebugLines.swift
          - Places
          - Cesium/CNTileStreamer.h
          - Cesium/CNTileStreamer.mm
    dependencies:
      - package: CesiumNative
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    info:
      path: SourcesTV/Info.plist
      properties:
        CFBundleDisplayName: Also Maps
        GoogleMapsAPIKey: $(GOOGLE_MAPS_API_KEY)
        CesiumIonToken: $(CESIUM_ION_TOKEN)
        UILaunchScreen: {}
    settings:
      groups: [CesiumBridge]
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.also.maps
        PRODUCT_NAME: AlsoMapsTV
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AlsoMaps-Bridging-Header.h

  # The flying map on iPhone, with drone-style on-screen sticks and saved
  # places, sharing the Mac's screen map (Screen).
  AlsoMapsPhone:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: SourcesPhone
      - path: Sources
        includes:
          - Assets.xcassets
          - Navigation
          - NavigationRealityKit.swift
          - Static
          - Screen
          - MapInput.swift
          - Tracks
          - TrackSession.swift
          - TrackOverlay.swift
          - TubeExtruder.swift
          - StreamingSettings.swift
          - Signposts.swift
          - TileSource.swift
          - TileStreaming.swift
          - TileUploader.swift
          - DebugLines.swift
          - Places
          - Cesium/CNTileStreamer.h
          - Cesium/CNTileStreamer.mm
    dependencies:
      - package: CesiumNative
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    info:
      path: SourcesPhone/Info.plist
      properties:
        CFBundleDisplayName: Also Maps
        GoogleMapsAPIKey: $(GOOGLE_MAPS_API_KEY)
        CesiumIonToken: $(CESIUM_ION_TOKEN)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      groups: [CesiumBridge]
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.also.maps
        PRODUCT_NAME: AlsoMapsPhone
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AlsoMaps-Bridging-Header.h
